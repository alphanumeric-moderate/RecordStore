name: CodSpeed Direct-Key Change Diff

on:
  pull_request:

permissions:
  contents: read
  id-token: write

env:
  LUNE_VERSION: "0.11.0"

jobs:
  direct-key-change-diff:
    if: github.event.pull_request.head.ref == 'perf/direct-key-change-diff-set-2026-10-16'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Lune
        run: |
          curl -fsSL -o lune.zip "https://github.com/lune-org/lune/releases/download/v${LUNE_VERSION}/lune-${LUNE_VERSION}-linux-x86_64.zip"
          mkdir -p "$HOME/.local/bin"
          unzip -o lune.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/lune"
          rm lune.zip
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Prepare baseline source from PR base
        run: |
          base_ref="$(git merge-base HEAD "origin/$GITHUB_BASE_REF")"
          git show "$base_ref:src/RecordStore.luau" > src/RecordStore.preoptimization.luau

      - name: Run compatibility regression suite
        run: lune run bench/run_regression_tests.luau

      - name: Run paired Simulation benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          config: codspeed-direct-key-change-diff.yml

      - name: Run paired WallTime benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: walltime
          config: codspeed-direct-key-change-diff.yml
