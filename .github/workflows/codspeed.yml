name: CodSpeed

on:
  push:
    branches:
      - "main"
  pull_request:
  # Manual dispatch defaults to benchmarks only. Regression suites are an explicit later pass.
  workflow_dispatch:
    inputs:
      run_regressions:
        description: "Run the available regression suites in the separate verification pass"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # for OpenID Connect authentication with CodSpeed

env:
  LUNE_VERSION: "0.11.0"

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lune
        run: |
          curl -fsSL -o lune.zip "https://github.com/lune-org/lune/releases/download/v${LUNE_VERSION}/lune-${LUNE_VERSION}-linux-x86_64.zip"
          mkdir -p "$HOME/.local/bin"
          unzip -o lune.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/lune"
          rm lune.zip
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Report benchmark phase and checked-out revision
        run: |
          echo "Checked-out commit: $(git rev-parse HEAD)"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.run_regressions }}" == "true" ]]; then
              echo "Phase: regression pass explicitly requested."
            else
              echo "Phase: benchmark-only; regression/failure/safety suites are intentionally deferred."
            fi
          elif [[ "${{ contains(github.event.pull_request.body, '[benchmark-only]') }}" == "true" ]]; then
            echo "Phase: benchmark-only; regression/failure/safety suites are intentionally deferred."
          else
            echo "Phase: full regression gate enabled."
          fi

      # Remove [benchmark-only] from the PR body to re-enable feature-failure gates.
      - name: Check the regression suite passes
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_regressions) || (github.event_name != 'workflow_dispatch' && !contains(github.event.pull_request.body, '[benchmark-only]')) }}
        run: |
          lune run bench/run_regression_tests.luau
          lune run bench/mailbox_v2_regression.bench.luau
          lune run bench/run_v2_simulator_regression.luau
          lune run bench/run_v2_adapter_regression.luau
          lune run bench/run_v2_record_bridge_regression.luau
          lune run bench/run_v2_runtime_governor_regression.luau
          lune run bench/run_v2_production_path_failure_matrix.luau
          lune run bench/run_codenum_regression_tests.luau
          lune run bench/run_codenumvalue_regression_tests.luau
          lune run bench/run_playerdata_set_regression_tests.luau

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation,walltime
          # Benchmarks are defined in codspeed.yml
