name: CodSpeed CPU Simulation

on:
  push:
    branches:
      - "main"
  pull_request:
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # for OpenID Connect authentication with CodSpeed

env:
  LUNE_VERSION: "0.11.0"

jobs:
  benchmarks:
    name: Run simulation benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Lune
        timeout-minutes: 2
        run: |
          curl -fsSL -o lune.zip "https://github.com/lune-org/lune/releases/download/v${LUNE_VERSION}/lune-${LUNE_VERSION}-linux-x86_64.zip"
          mkdir -p "$HOME/.local/bin"
          unzip -o lune.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/lune"
          rm lune.zip
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run the benchmarks
        timeout-minutes: 16
        uses: CodSpeedHQ/action@v5
        with:
          # CPU simulation is hardware-normalized; WallTime runs in a separate Macro Runner workflow.
          mode: simulation
          # Benchmarks are defined in codspeed.yml
