name: CodSpeed

on:
  push:
    branches:
      - "main"
  pull_request:
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # for OpenID Connect authentication with CodSpeed

env:
  LUNE_VERSION: "0.11.0"

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lune
        run: |
          curl -fsSL -o lune.zip "https://github.com/lune-org/lune/releases/download/v${LUNE_VERSION}/lune-${LUNE_VERSION}-linux-x86_64.zip"
          mkdir -p "$HOME/.local/bin"
          unzip -o lune.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/lune"
          rm lune.zip
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check the regression suite passes
        run: |
          lune run bench/run_regression_tests.luau
          lune run bench/run_codenum_regression_tests.luau
          lune run bench/run_codenumvalue_regression_tests.luau
          lune run bench/run_playerdata_set_regression_tests.luau
          lune run bench/run_advanced_scheduler_regression.luau

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation,walltime
          # Benchmarks are defined in codspeed.yml
