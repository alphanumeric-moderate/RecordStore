name: CodSpeed CPU Simulation

on:
  push:
    branches:
      - "main"
  pull_request:
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # for OpenID Connect authentication with CodSpeed

env:
  LUNE_VERSION: "0.11.0"

jobs:
  benchmarks:
    name: Run simulation benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare paired historical Update benchmarks
        run: |
          git show 6bdee16fc6e02cbc25fb90aa3a6229bb3c56579a:src/RecordStore.luau > benchmarks/RecordStore.preoptimization.luau
          sed 's/local variant = "optimized"/local variant = "baseline"/; s@local module_path = "../src/PlayerDataInitializer/RecordStore"@local module_path = "./RecordStore.preoptimization"@' benchmarks/RecordStore.bench.luau > benchmarks/RecordStore.baseline.bench.luau
          cp benchmarks/RecordStore.bench.luau benchmarks/RecordStore.optimized.bench.luau

      - name: Install Lune
        timeout-minutes: 2
        run: |
          curl -fsSL -o lune.zip "https://github.com/lune-org/lune/releases/download/v${LUNE_VERSION}/lune-${LUNE_VERSION}-linux-x86_64.zip"
          mkdir -p "$HOME/.local/bin"
          unzip -o lune.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/lune"
          rm lune.zip
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run the benchmarks
        timeout-minutes: 35
        uses: CodSpeedHQ/action@v5
        with:
          # Use hosted-runner CPU simulation. This personal account cannot run Macro Runners; do not accept exec-harness WallTime results.
          mode: simulation
          # Benchmarks are defined in codspeed.yml
