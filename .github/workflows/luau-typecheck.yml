name: Luau Type Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze all source modules
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Luau LSP
        env:
          LUAU_LSP_VERSION: 1.70.1
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/luau-lsp.zip "https://github.com/JohnnyMorganz/luau-lsp/releases/download/${LUAU_LSP_VERSION}/luau-lsp-linux-x86_64.zip"
          unzip -o /tmp/luau-lsp.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/luau-lsp"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Rojo
        env:
          ROJO_VERSION: 7.7.1
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/rojo.zip "https://github.com/rojo-rbx/rojo/releases/download/v${ROJO_VERSION}/rojo-${ROJO_VERSION}-linux-x86_64.zip"
          unzip -o /tmp/rojo.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/rojo"

      - name: Fetch Roblox API definitions
        run: |
          set -euo pipefail
          curl -fsSL "https://luau-lsp.pages.dev/type-definitions/globalTypes.None.d.luau" -o /tmp/globalTypes.d.luau
          test -s /tmp/globalTypes.d.luau

      - name: Validate adapter-free native-formatting regression project
        run: |
          set -euo pipefail
          rojo build tests-native-formatting.project.json -o /tmp/RecordStore-NativeFormattingRegression.rbxlx
          test -s /tmp/RecordStore-NativeFormattingRegression.rbxlx

      - name: Generate a Rojo sourcemap
        run: |
          set -euo pipefail
          rojo sourcemap default.project.json --include-non-scripts --output /tmp/sourcemap.json
          test -s /tmp/sourcemap.json

      - name: Require strict mode for RecordStore modules
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path("src/PlayerDataInitializer/RecordStore.luau"),
              Path("src/PlayerDataInitializer/RecordStoreScheduler.luau"),
              Path("src/PlayerDataInitializer/MailboxV2.luau"),
          ]
          missing = [str(path) for path in paths if not path.read_text().startswith("--!strict")]
          if missing:
              print("RecordStore modules must begin with --!strict:")
              print("\\n".join(missing))
              raise SystemExit(1)
          print("Strict mode enabled in all RecordStore modules")
          PY

      - name: Type-check all source modules using their declared modes
        run: |
          set -euo pipefail
          mapfile -t modules < <(find src -type f -name '*.luau' -print | sort)
          test "${#modules[@]}" -gt 0
          printf 'Analyzing %s Luau source modules using declared modes\\n' "${#modules[@]}"
          luau-lsp analyze --platform=roblox --definitions=/tmp/globalTypes.d.luau --sourcemap=/tmp/sourcemap.json "${modules[@]}"
