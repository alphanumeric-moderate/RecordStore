name: Luau Type Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze all source modules
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Luau LSP
        env:
          LUAU_LSP_VERSION: 1.70.1
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/luau-lsp.zip "https://github.com/JohnnyMorganz/luau-lsp/releases/download/${LUAU_LSP_VERSION}/luau-lsp-linux-x86_64.zip"
          unzip -o /tmp/luau-lsp.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/luau-lsp"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Rojo
        env:
          ROJO_VERSION: 7.7.1
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/rojo.zip "https://github.com/rojo-rbx/rojo/releases/download/v${ROJO_VERSION}/rojo-${ROJO_VERSION}-linux-x86_64.zip"
          unzip -o /tmp/rojo.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/rojo"

      - name: Fetch Roblox API definitions
        run: |
          set -euo pipefail
          curl -fsSL "https://luau-lsp.pages.dev/type-definitions/globalTypes.None.d.luau" -o /tmp/globalTypes.d.luau
          test -s /tmp/globalTypes.d.luau

      - name: Validate adapter-free native-formatting regression project
        run: |
          set -euo pipefail
          rojo build tests-native-formatting.project.json -o /tmp/RecordStore-NativeFormattingRegression.rbxlx
          test -s /tmp/RecordStore-NativeFormattingRegression.rbxlx

      - name: Generate a Rojo sourcemap
        run: |
          set -euo pipefail
          rojo sourcemap default.project.json --include-non-scripts --output /tmp/sourcemap.json
          test -s /tmp/sourcemap.json

      - name: Require strict mode for the consolidated RecordStore module
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/PlayerDataInitializer/RecordStore.luau")
          if not path.read_text().startswith("--!strict"):
              print(f"{path} must begin with --!strict")
              raise SystemExit(1)
          print("Strict mode enabled for the consolidated RecordStore module")
          PY

      - name: Require in-file scheduler and mailbox implementations
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          root = Path("src/PlayerDataInitializer")
          source = (root / "RecordStore.luau").read_text()
          forbidden = [
              r"require\s*\(\s*script\.Parent\.RecordStoreScheduler\s*\)",
              r"require\s*\(\s*script\.Parent\.Mailbox\s*\)",
          ]
          required_declarations = [
              "local RecordStoreScheduler: EmbeddedSchedulerModule = {} :: EmbeddedSchedulerModule",
              "local Mailbox = {}",
              "function Mailbox.new(",
          ]
          violations = [pattern for pattern in forbidden if re.search(pattern, source)]
          missing = [declaration for declaration in required_declarations if source.count(declaration) != 1]
          separate = [
              str(path) for path in (
                  root / "RecordStoreScheduler.luau",
                  root / "Mailbox.luau",
              ) if path.exists()
          ]
          if violations or missing or separate:
              if violations:
                  print("RecordStore must not require separate scheduler/mailbox implementations:")
                  print("\n".join(violations))
              if missing:
                  print("Missing or duplicated embedded scheduler/mailbox declarations:")
                  print("\n".join(missing))
              if separate:
                  print("Separate implementation files must not remain:")
                  print("\n".join(separate))
              raise SystemExit(1)
          queue_version = re.search(r"^local QUEUE_IMPLEMENTATION_VERSION = (\\d+)$", source, re.MULTILINE)
          queue_contract = [
              "implementation_version = QUEUE_IMPLEMENTATION_VERSION,",
              "implementation_version ~= 2 and implementation_version ~= QUEUE_IMPLEMENTATION_VERSION",
          ]
          missing_queue_contract = [item for item in queue_contract if item not in source]
          if queue_version is None or missing_queue_contract:
              print("Embedded Mailbox queue version or v2 compatibility contract is missing")
              print("\\n".join(missing_queue_contract))
              raise SystemExit(1)
          print(f"Scheduler and Mailbox V1 API implementations are embedded in RecordStore.luau; new durable queue envelopes use implementation version {queue_version.group(1)} and version-2 envelopes remain readable for compatibility")
          PY

      - name: Require explicit types at Studio solver-sensitive boundaries
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path("src/PlayerDataInitializer/RecordStore.luau").read_text()
          required = [
              'local batch_size_value: number = if type(batch_size) == "number" then batch_size :: number else 4',
              'local handler_thread: thread = coroutine.create(function()',
              'local retry_attempts: number = current.attempts :: number',
              'local exponent_candidate: number = retry_attempts - 1',
              'if exponent_candidate < 0 then exponent_candidate = 0 end',
              'local exponent: number = if exponent_candidate > 16 then 16 else exponent_candidate',
              'local digest_value: string = digest(digest_input)',
              'string.sub(message :: string, 1, 200)',
          ]
          missing = [annotation for annotation in required if source.count(annotation) != 1]
          if missing:
              print("Missing or duplicated solver-sensitive type boundary:")
              print("\\n".join(missing))
              raise SystemExit(1)
          print("All listed solver-sensitive expressions have explicit type boundaries")
          PY

      - name: Type-check all source modules using their declared modes
        run: |
          set -euo pipefail
          # AlyaNum is pinned upstream source. Its runtime syntax is exercised by the Lune
          # regressions; its generic metatable annotations are not supported by this LSP version.
          mapfile -t modules < <(find src -type f -name '*.luau' ! -path 'src/AlyaNum/*' -print | sort)
          test "${#modules[@]}" -gt 0
          printf 'Analyzing %s Luau source modules using declared modes\n' "${#modules[@]}"
          luau-lsp analyze --platform=roblox --definitions=/tmp/globalTypes.d.luau --sourcemap=/tmp/sourcemap.json "${modules[@]}"

      - name: Type-check strict production modules with the new solver
        run: |
          set -euo pipefail
          mapfile -t strict_modules < <(
            while IFS= read -r path; do
              mode="$(awk '
                /^[[:space:]]*$/ { next }
                /^--!/ {
                  if ($0 ~ /^--!strict([[:space:]]|$)/) {
                    print "--!strict"
                    exit
                  }
                  if ($0 ~ /^--!(nonstrict|nocheck)([[:space:]]|$)/) {
                    exit
                  }
                  next
                }
                /^--/ { next }
                { exit }
              ' "$path")"
              if [[ "$mode" == "--!strict" ]]; then
                printf '%s\n' "$path"
              fi
            done < <(find src -type f -name '*.luau' ! -path 'src/AlyaNum/*' -print | sort)
          )
          test "${#strict_modules[@]}" -gt 0
          printf 'Analyzing %s strict Luau source modules with the new solver\n' "${#strict_modules[@]}"
          luau-lsp analyze \
            --platform=roblox \
            --definitions=/tmp/globalTypes.d.luau \
            --sourcemap=/tmp/sourcemap.json \
            --settings=typecheck/fixtures/settings/new-solver.json \
            "${strict_modules[@]}"

      - name: Generate the fixture DataModel sourcemap
        run: |
          set -euo pipefail
          rojo sourcemap typecheck/fixtures/datamodel.project.json --include-non-scripts --output /tmp/typecheck-datamodel-sourcemap.json
          test -s /tmp/typecheck-datamodel-sourcemap.json

      - name: Evaluate strict typing, DataModel, and solver fixtures
        run: |
          set -euo pipefail
          python3 bench/run_luau_typecheck_fixtures.py \
            --luau-lsp "$HOME/.local/bin/luau-lsp" \
            --definitions /tmp/globalTypes.d.luau \
            --datamodel-sourcemap /tmp/typecheck-datamodel-sourcemap.json \
            --report /tmp/luau-typecheck-fixtures.json
