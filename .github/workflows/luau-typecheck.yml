name: Luau Type Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze all source modules
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Luau LSP
        env:
          LUAU_LSP_VERSION: 1.70.1
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/luau-lsp.zip "https://github.com/JohnnyMorganz/luau-lsp/releases/download/${LUAU_LSP_VERSION}/luau-lsp-linux-x86_64.zip"
          unzip -o /tmp/luau-lsp.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/luau-lsp"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Rojo
        env:
          ROJO_VERSION: 7.7.1
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/rojo.zip "https://github.com/rojo-rbx/rojo/releases/download/v${ROJO_VERSION}/rojo-${ROJO_VERSION}-linux-x86_64.zip"
          unzip -o /tmp/rojo.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/rojo"

      - name: Fetch Roblox API definitions
        run: |
          set -euo pipefail
          curl -fsSL "https://luau-lsp.pages.dev/type-definitions/globalTypes.None.d.luau" -o /tmp/globalTypes.d.luau
          test -s /tmp/globalTypes.d.luau

      - name: Validate adapter-free native-formatting regression project
        run: |
          set -euo pipefail
          rojo build tests-native-formatting.project.json -o /tmp/RecordStore-NativeFormattingRegression.rbxlx
          test -s /tmp/RecordStore-NativeFormattingRegression.rbxlx

      - name: Generate a sourcemap with the established RecordStore mode
        run: |
          set -euo pipefail
          sed '1s/^--!strict$/--!nonstrict/' src/PlayerDataInitializer/RecordStore.luau > /tmp/RecordStore.nonstrict.luau
          rojo sourcemap default.project.json --include-non-scripts --output /tmp/sourcemap.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          source_map_path = Path("/tmp/sourcemap.json")
          source_map = json.loads(source_map_path.read_text())
          replacement = "/tmp/RecordStore.nonstrict.luau"
          target_suffix = "src/PlayerDataInitializer/RecordStore.luau"
          replaced = 0

          def rewrite(node):
              global replaced
              if isinstance(node, dict):
                  paths = node.get("filePaths", [])
                  if node.get("name") == "RecordStore" and any(str(path).replace("\\", "/").endswith(target_suffix) for path in paths):
                      node["filePaths"] = [replacement]
                      replaced += 1
                  for value in node.values():
                      rewrite(value)
              elif isinstance(node, list):
                  for value in node:
                      rewrite(value)

          rewrite(source_map)
          if replaced != 1:
              raise SystemExit(f"expected exactly one RecordStore sourcemap node, found {replaced}")
          source_map_path.write_text(json.dumps(source_map))
          PY
          test -s /tmp/sourcemap.json

      - name: Capture strict RecordStore diagnostics
        continue-on-error: true
        run: |
          set +e
          timeout 180s luau-lsp analyze --platform=roblox --definitions=/tmp/globalTypes.d.luau --sourcemap=/tmp/sourcemap.json \
            src/PlayerDataInitializer/RecordStore.luau \
            src/PlayerDataInitializer/RecordStoreScheduler.luau \
            src/PlayerDataInitializer/MailboxV2.luau > /tmp/RecordStore.strict.log 2>&1
          status=$?
          set -e
          ANALYZER_STATUS="$status" python3 - <<'PY'
          import collections
          import os
          import re
          from pathlib import Path

          lines = Path("/tmp/RecordStore.strict.log").read_text(errors="replace").splitlines()
          relevant = [
              line for line in lines
              if "TypeError:" in line
              or "Internal error:" in line
              or "Code is too complex to typecheck" in line
          ]
          internal = [line for line in relevant if "Internal error:" in line or "blocked-" in line]
          paths = ("RecordStore.luau", "RecordStoreScheduler.luau", "MailboxV2.luau")
          by_module = {path: [] for path in paths}
          for line in relevant:
              matched = next((path for path in paths if path in line), None)
              if matched is not None:
                  by_module[matched].append(line)

          categories = collections.Counter()
          for line in relevant:
              match = re.search(r"(?:TypeError|Internal error): (.*)", line)
              if match is None:
                  continue
              message = match.group(1)
              if message.startswith("Key '"):
                  category = "Missing field/key"
              elif message.startswith("Unknown type used in "):
                  category = "Unknown operand type"
              elif message.startswith("Expected this to be"):
                  category = "Type mismatch"
              elif message.startswith("Table type"):
                  category = "Table shape mismatch"
              elif message.startswith("Argument count mismatch"):
                  category = "Argument count mismatch"
              elif message.startswith("Value of type"):
                  category = "Nilability mismatch"
              else:
                  category = message[:110]
              categories[category] += 1

          print(f"Strict RecordStore-family diagnostics: {len(relevant)}")
          print(f"Internal/blocked diagnostics: {len(internal)}")
          print(f"Analyzer exit status: {os.environ['ANALYZER_STATUS']}")
          for name, items in by_module.items():
              print(f"--- {name}: {len(items)} diagnostics; first 10 ---")
              for line in items[:10]:
                  print(line)
          print("--- Most common diagnostic shapes ---")
          for category, count in categories.most_common(20):
              print(f"{count}: {category}")
          PY

      - name: Analyze every source module
        run: |
          set -euo pipefail
          mapfile -t modules < <(find src -type f -name '*.luau' ! -path 'src/PlayerDataInitializer/RecordStore.luau' -print | sort)
          test "${#modules[@]}" -gt 0
          printf 'Analyzing %s Luau source modules plus RecordStore in its established nonstrict mode\n' "${#modules[@]}"
          luau-lsp analyze --platform=roblox --definitions=/tmp/globalTypes.d.luau --sourcemap=/tmp/sourcemap.json "${modules[@]}"
          luau-lsp analyze --platform=roblox --definitions=/tmp/globalTypes.d.luau --sourcemap=/tmp/sourcemap.json /tmp/RecordStore.nonstrict.luau
