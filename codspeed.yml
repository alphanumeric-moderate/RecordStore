$schema: https://raw.githubusercontent.com/CodSpeedHQ/codspeed/refs/heads/main/schemas/codspeed.schema.json

# RecordStore benchmarks, executed with Lune (standalone Luau runtime) through
# bench/RobloxShim.luau, which provides the Roblox APIs used by RecordStore.Mock.
benchmarks:
  - name: "advanced scheduler mixed-policy smoke workload"
    exec: lune run bench/advanced_scheduler.bench.luau

  - name: "advanced scheduler FIFO baseline"
    exec: lune run bench/advanced_scheduler_fifo.bench.luau

  - name: "advanced scheduler weighted selection"
    exec: lune run bench/advanced_scheduler_weighted.bench.luau

  - name: "advanced scheduler deadline selection"
    exec: lune run bench/advanced_scheduler_deadline.bench.luau

  - name: "advanced scheduler deficit round robin"
    exec: lune run bench/advanced_scheduler_drr.bench.luau

  - name: "session lifecycle (create/update/save/close/reopen)"
    exec: lune run bench/session_lifecycle.bench.luau

  - name: "large profile update and save"
    exec: lune run bench/large_profile.bench.luau

  - name: "legacy envelope migration and history recovery"
    exec: lune run bench/legacy_migration.bench.luau

  - name: "read and version history access"
    exec: lune run bench/read_history.bench.luau

  - name: "compatibility regression suite"
    exec: lune run bench/run_compatibility_regression_tests.luau

  - name: "CodeNum arithmetic and codec round-trips"
    exec: lune run bench/codenum.bench.luau

  - name: "CodeNumValue format and normalization"
    exec: lune run bench/codenumvalue.bench.luau

  - name: "PlayerData startup with legacy eager CodeNumValue load"
    exec: lune run bench/playerdata_startup_eager.bench.luau

  - name: "PlayerData startup with lazy optional CodeNumValue load"
    exec: lune run bench/playerdata_startup_lazy.bench.luau

  - name: "PlayerData.Set path lookup"
    exec: lune run bench/playerdata_set_paths.bench.luau
