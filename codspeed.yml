$schema: https://raw.githubusercontent.com/CodSpeedHQ/codspeed/refs/heads/main/schemas/codspeed.schema.json

options:
  warmup-time: "1s"

benchmarks:
  - name: "RecordStore pre-optimization Update Batch"
    exec: lune run benchmarks/RecordStore.bench.luau baseline
    options:
      max-time: "30s"

  - name: "RecordStore optimized Update Batch"
    exec: lune run benchmarks/RecordStore.bench.luau optimized
    options:
      max-time: "30s"
