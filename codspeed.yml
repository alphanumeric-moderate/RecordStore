$schema: https://raw.githubusercontent.com/CodSpeedHQ/codspeed/refs/heads/main/schemas/codspeed.schema.json

# RecordStore benchmarks, executed with Lune (standalone Luau runtime) through
# bench/RobloxShim.luau, which provides the Roblox APIs used by RecordStore.Mock.
benchmarks:
  - name: "advanced scheduler mixed-policy smoke workload (128 items)"
    exec: lune run bench/advanced_scheduler.bench.luau

  - name: "lease renewal full diagnostic snapshot"
    exec: lune run bench/lease_renewal_stats.bench.luau

  - name: "lease renewal lightweight advice"
    exec: lune run bench/lease_renewal_advice.bench.luau

  - name: "advanced scheduler FIFO baseline (128 items)"
    exec: lune run bench/advanced_scheduler_fifo.bench.luau

  - name: "advanced scheduler weighted selection (128 items)"
    exec: lune run bench/advanced_scheduler_weighted.bench.luau

  - name: "advanced scheduler deadline selection (128 items)"
    exec: lune run bench/advanced_scheduler_deadline.bench.luau

  - name: "advanced scheduler deficit round robin (128 items)"
    exec: lune run bench/advanced_scheduler_drr.bench.luau

  - name: "scheduler disabled direct-execution baseline"
    exec: lune run bench/scheduler_disabled_overhead.bench.luau

  - name: "scheduler enabled dispatch workload"
    exec: lune run bench/scheduler_enabled_overhead.bench.luau

  - name: "session lifecycle (create/update/save/close/reopen)"
    exec: lune run bench/session_lifecycle.bench.luau

  - name: "production DataStore adapter lifecycle and ambiguous-write recovery"
    exec: lune run bench/production_adapter.bench.luau

  - name: "large profile update and save"
    exec: lune run bench/large_profile.bench.luau

  - name: "change-event diff with wide profile"
    exec: lune run bench/change_diff.bench.luau

  - name: "legacy envelope migration and history recovery"
    exec: lune run bench/legacy_migration.bench.luau

  - name: "read and version history access"
    exec: lune run bench/read_history.bench.luau

  - name: "compatibility regression suite"
    exec: lune run bench/run_compatibility_regression_tests.luau

  - name: "InfiniteMath high-range arithmetic and reconstruction"
    exec: lune run bench/infinimath.bench.luau

  - name: "InfiniteMathValue format and normalization"
    exec: lune run bench/infinimathvalue.bench.luau

  - name: "PlayerData startup with legacy eager InfiniteMathValue load"
    exec: lune run bench/playerdata_startup_eager.bench.luau

  - name: "PlayerData startup with lazy optional InfiniteMathValue load"
    exec: lune run bench/playerdata_startup_lazy.bench.luau

  - name: "PlayerData opt-in transaction wrapper"
    exec: lune run bench/playerdata_transactions.bench.luau

  - name: "PlayerData.Set path lookup"
    exec: lune run bench/playerdata_set_paths.bench.luau

  - name: "InfiniteMath range regressions"
    exec: lune run bench/run_infinimath_regression_tests.luau

  - name: "InfiniteMathValue persistence regressions"
    exec: lune run bench/run_infinimathvalue_regression_tests.luau
